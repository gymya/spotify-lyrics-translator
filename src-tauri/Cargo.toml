[package]
name = "spotify-lyrics-translator"
version = "0.1.0"
edition = "2021"

[lib]
name = "lyrics_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "process", "sync", "rt", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
httpdate = "1"
html-escape = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSPanel", "NSView", "NSResponder", "NSColor", "NSGraphics", "NSEvent", "NSApplication", "NSScreen"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSGeometry", "NSNotification", "NSString"] }
